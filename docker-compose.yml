version: '3.8'

services:
  # ========================================
  # PostgreSQL - Base de données relationnelle
  # ========================================
  postgres:
    image: postgres:15-alpine
    container_name: hexlegia-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-hexlegia}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-hexlegia_password}
      POSTGRES_DB: ${POSTGRES_DB:-hexlegia_db}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/migrations:/docker-entrypoint-initdb.d
    ports:
      - "5432:5432"
    networks:
      - hexlegia-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-hexlegia} -d ${POSTGRES_DB:-hexlegia_db}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ========================================
  # Qdrant - Base de données vectorielle
  # ========================================
  qdrant:
    image: qdrant/qdrant:v1.8.0
    container_name: hexlegia-qdrant
    restart: unless-stopped
    volumes:
      - qdrant_data:/qdrant/storage
    ports:
      - "6333:6333"
      - "6334:6334"
    networks:
      - hexlegia-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:6333/readyz"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ========================================
  # Backend - API FastAPI
  # ========================================
  backend:
    build:
      context: .
      dockerfile: docker/Dockerfile.backend
    container_name: hexlegia-backend
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-hexlegia}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-hexlegia_password}
      POSTGRES_DB: ${POSTGRES_DB:-hexlegia_db}
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      QDRANT_HOST: qdrant
      QDRANT_PORT: 6333
      BACKEND_HOST: 0.0.0.0
      BACKEND_PORT: ${BACKEND_PORT:-8000}
      BACKEND_DEBUG: ${BACKEND_DEBUG:-true}
      SECRET_KEY: ${SECRET_KEY:-change-me-in-production-for-jwt-signing}
      ALGORITHM: ${ALGORITHM:-HS256}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      AUDIT_ENABLED: ${AUDIT_ENABLED:-true}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3000,http://localhost:8000}
      MISTRAL_API_KEY: ${MISTRAL_API_KEY:-test-mistral-api-key}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-test-openai-api-key}
    depends_on:
      postgres:
        condition: service_healthy
      qdrant:
        condition: service_healthy
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    volumes:
      - ./backend:/app/backend
      - ./tests:/app/tests
      - ./docker/logs:/var/log/hexlegia
    networks:
      - hexlegia-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ========================================
  # Frontend - Application React
  # ========================================
  frontend:
    build:
      context: .
      dockerfile: docker/Dockerfile.frontend
      args:
        REACT_APP_API_URL: ${REACT_APP_API_URL:-http://localhost:8000}
    container_name: hexlegia-frontend
    restart: unless-stopped
    environment:
      REACT_APP_API_URL: ${REACT_APP_API_URL:-http://localhost:8000}
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "${FRONTEND_PORT:-3000}:3000"
    volumes:
      - ./frontend:/app/frontend
    networks:
      - hexlegia-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ========================================
  # pgAdmin - Interface d'administration PostgreSQL (Optionnel)
  # ========================================
  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: hexlegia-pgadmin
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@hexlegia.com
      PGADMIN_DEFAULT_PASSWORD: admin
      PGADMIN_CONFIG_SERVER_MODE: 'False'
    ports:
      - "5050:80"
    volumes:
      - pgadmin_data:/var/lib/pgadmin
    networks:
      - hexlegia-network
    profiles:
      - tools

networks:
  hexlegia-network:
    driver: bridge

volumes:
  postgres_data:
  qdrant_data:
  pgadmin_data:
